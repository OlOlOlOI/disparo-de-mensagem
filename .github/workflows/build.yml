name: Gerar instaladores

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg

  publicar:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Instaladores (build ${{ github.run_number }})
          draft: true
          files: |
            instaladores/*.exe
            instaladores/*.dmg
